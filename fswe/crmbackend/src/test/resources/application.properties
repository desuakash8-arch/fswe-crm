# Tests never import machine-local credentials.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:crm_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.mail.enabled=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.transaction=INFO
# Payment tests use a simulated gateway; keep real test keys in application-local.properties.
razorpay.key.id=
razorpay.key.secret=

app.jwt.secret=isolated-test-key-with-at-least-32-bytes-long
app.jobs.enabled=false
app.ai.groq-api-key=
spring.flyway.enabled=false
