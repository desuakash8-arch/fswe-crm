# Use alongside prod. Aiven requires encrypted, identity-verified MySQL.
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=changeit
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false
# Flyway opens its own connections, separate from Hikari.
spring.flyway.jdbc-properties.sslMode=VERIFY_IDENTITY
spring.flyway.jdbc-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL}
spring.flyway.jdbc-properties.trustCertificateKeyStoreType=PKCS12
spring.flyway.jdbc-properties.trustCertificateKeyStorePassword=changeit
spring.flyway.jdbc-properties.fallbackToSystemTrustStore=false
