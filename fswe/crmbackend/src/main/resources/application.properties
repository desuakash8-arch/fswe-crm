spring.application.name=crmbackend
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm_db}
# Working local credentials are in the ignored application-local.properties file.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Versioned migrations run before Hibernate validates the schema.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
server.port=${PORT:${SERVER_PORT:8085}}

# SMTP is optional. Set MAIL_ENABLED=true and a valid sender to send emails.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:crm@localhost}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.resend-api-key=${RESEND_API_KEY:}
# Local testing only: blank preserves the assigned employee as recipient.
app.mail.recipient-override=${MAIL_RECIPIENT_OVERRIDE:}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.public-url=${PUBLIC_APP_URL:http://127.0.0.1:5173}
app.jobs.enabled=${BACKGROUND_JOBS_ENABLED:true}
# Every new CRM notification is emailed when app.mail.enabled=true.

# Keep payment credentials in the ignored local file or environment.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Canonical Spring property; existing private JWT_SECRET settings still work.
app.jwt.secret=${JWT_SECRET}

# Optional first administrator for a fresh cloud database; never overwrites users.
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.name=${BOOTSTRAP_ADMIN_NAME:CRM Administrator}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
